name: Publish to npm

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    # Deployment environment: restricts which refs can publish (see repo Environments).
    # No required reviewers — tag push by maintainers remains the release trigger (OIDC).
    environment: npm

    permissions:
      # Required for gh release create to write the GitHub Release.
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 24.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.x"
          cache: npm
          # DO NOT set registry-url — it writes .npmrc with empty token
          # which overrides OIDC auth and causes 404

      - name: Install dependencies
        run: npm ci

      # Build with the exact publish config so the artifacts CI tests are the
      # artifacts that ship (prepublishOnly re-runs this — kept explicit so
      # the workflow doesn't silently depend on the hook).
      - name: Build (publish config — no sourcemaps)
        run: npm run build:publish

      - name: Run tests
        run: npm test

      - name: Publish to npm (OIDC trusted publishing, no token needed)
        run: npm publish --access public

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        # Plain vX.Y.Z -> full release marked Latest.
        # vX.Y.Z-<pre> (e.g. v7.1.0-beta, v7.1.0-rc.1) -> prerelease, never Latest.
        # Build metadata (+...) after a prerelease part is allowed. Any other v* tag -> full release, not marked Latest.
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release $GITHUB_REF_NAME already exists"
            exit 0
          fi
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+(\+[0-9A-Za-z.-]+)?$ ]]; then
            release_flags=(--prerelease --latest=false)
          elif [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            release_flags=(--latest)
          else
            echo "::warning::$GITHUB_REF_NAME is not vX.Y.Z or vX.Y.Z-<prerelease>; creating a release not marked Latest"
            release_flags=(--latest=false)
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes "${release_flags[@]}"
