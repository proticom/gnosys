name: Publish to npm

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    # Deployment environment: restricts which refs can publish (see repo Environments).
    # No required reviewers — tag push by maintainers remains the release trigger (OIDC).
    environment: npm

    permissions:
      # Required for gh release create to write the GitHub Release.
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Decide the npm dist-tag and GitHub Release flags once, before publishing,
      # so both steps agree:
      #   vX.Y.Z, highest plain vX.Y.Z tag      -> npm latest,       Release --latest
      #   vX.Y.Z, older than the highest plain  -> npm v<major>-latest, Release --latest=false
      #   vX.Y.Z-<pre>[+build]                  -> npm next,         Release --prerelease --latest=false
      #   anything else (warning)               -> npm next,         Release --latest=false
      # Prerelease tags are ignored when finding the highest plain tag.
      - name: Classify tag
        id: classify
        run: |
          tag="$GITHUB_REF_NAME"
          plain_re='^v[0-9]+\.[0-9]+\.[0-9]+$'
          pre_re='^v[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+(\+[0-9A-Za-z.-]+)?$'
          if [[ "$tag" =~ $pre_re ]]; then
            npm_tag=next; gh_prerelease=true; gh_latest=false
          elif [[ "$tag" =~ $plain_re ]]; then
            gh_prerelease=false
            highest=$(git ls-remote --tags --refs origin 'refs/tags/v*' \
              | sed 's|.*refs/tags/||' \
              | { grep -E "$plain_re" || true; } \
              | sed 's/^v//' \
              | sort -t. -k1,1n -k2,2n -k3,3n \
              | tail -n 1)
            if [[ -z "$highest" || "v$highest" == "$tag" ]]; then
              npm_tag=latest; gh_latest=true
            else
              major="${tag#v}"; major="${major%%.*}"
              npm_tag="v${major}-latest"; gh_latest=false
              echo "$tag is older than the highest plain tag v$highest; npm dist-tag $npm_tag, not GitHub Latest"
            fi
          else
            echo "::warning::$tag is not vX.Y.Z or vX.Y.Z-<prerelease>; publishing to npm dist-tag next and not marking the release Latest"
            npm_tag=next; gh_prerelease=false; gh_latest=false
          fi
          echo "tag=$tag npm_tag=$npm_tag gh_prerelease=$gh_prerelease gh_latest=$gh_latest"
          {
            echo "npm_tag=$npm_tag"
            echo "gh_prerelease=$gh_prerelease"
            echo "gh_latest=$gh_latest"
          } >> "$GITHUB_OUTPUT"

      - name: Use Node.js 24.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.x"
          cache: npm
          # DO NOT set registry-url — it writes .npmrc with empty token
          # which overrides OIDC auth and causes 404

      - name: Install dependencies
        run: npm ci

      # Build with the exact publish config so the artifacts CI tests are the
      # artifacts that ship (prepublishOnly re-runs this — kept explicit so
      # the workflow doesn't silently depend on the hook).
      - name: Build (publish config — no sourcemaps)
        run: npm run build:publish

      - name: Run tests
        run: npm test

      - name: Publish to npm (OIDC trusted publishing, no token needed)
        env:
          NPM_DIST_TAG: ${{ steps.classify.outputs.npm_tag }}
        run: npm publish --access public --tag "$NPM_DIST_TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PRERELEASE: ${{ steps.classify.outputs.gh_prerelease }}
          GH_LATEST: ${{ steps.classify.outputs.gh_latest }}
        # Flags come from the "Classify tag" step. Skipped if the release exists.
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release $GITHUB_REF_NAME already exists"
            exit 0
          fi
          release_flags=("--latest=$GH_LATEST")
          if [[ "$GH_PRERELEASE" == "true" ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes "${release_flags[@]}"
