name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Least privilege: jobs only need the checkout + read tree.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: ["22.16.0", "22.x", "24.x"]
        exclude:
          # macOS Node 22.16.0 (and 24.0.0) truncate piped stdout at ~8 KB on exit, so
          # `gnosys --help` captured via a pipe is cut off. Pre-existing Node bug, not
          # SQLite-related: released gnosys 6.3.1 shows the same truncation. Fixed by 22.17.0.
          # The floor stays covered on ubuntu; macOS runs 22.x and 24.x.
          - os: macos-latest
            node-version: "22.16.0"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        # Optional deps (@huggingface/transformers) are needed for tsc types; master got them implicitly via the old better-sqlite3 install step.
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Check embedded version before build
        run: ./node_modules/.bin/vitest run src/test/version-embedded.test.ts

      - name: Build
        run: npm run build

      - name: Check embedding fallback
        run: node scripts/check-embedding-fallback.mjs

      - name: Run tests
        run: npm test

      - name: Run tests with coverage
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '24.x'
        run: npm run test:coverage

      # v5.13.0: !cancelled() on the reporting/guardrail steps — vitest
      # writes coverage-summary.json before its threshold check exits
      # non-zero, so the per-file diagnostics below stay available exactly
      # when the gate fails (previously they were skipped, hiding the
      # actionable message).
      - name: Upload coverage report
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' && matrix.node-version == '24.x' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Check coverage thresholds
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' && matrix.node-version == '24.x' }}
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            echo "Coverage summary:"
            cat coverage/coverage-summary.json | node -e "
              const data = JSON.parse(require('fs').readFileSync('/dev/stdin', 'utf8'));
              const t = data.total;
              console.log('  Statements:', t.statements.pct + '%');
              console.log('  Branches:  ', t.branches.pct + '%');
              console.log('  Functions: ', t.functions.pct + '%');
              console.log('  Lines:     ', t.lines.pct + '%');
            "
          fi

      # v5.8.3 (#92): targeted guardrail — fail when a newly-added
      # src/lib/**/*.ts(x) file ships with 0% statement coverage. Catches
      # the regression mode that landed v5.8.0 in three back-to-back CI
      # failures (new modules without tests dropping the global average
      # under the 50% threshold).
      - name: Check coverage of newly-added files
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' && matrix.node-version == '24.x' }}
        run: |
          git fetch --no-tags --unshallow origin +refs/heads/master:refs/remotes/origin/master
          COVERAGE_BASE_REF=origin/master node scripts/check-new-file-coverage.mjs

      - name: Verify build output
        run: |
          test -f dist/index.js
          test -f dist/cli.js
          echo "Build artifacts verified"

  # Keep the Windows install and IDE-integration path honest. The primary
  # matrix historically covered only Unix hosts, which allowed npm .cmd shim
  # execution and Windows path-discovery regressions to ship unnoticed.
  windows-ide-integration:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run Windows IDE integration tests
        run: >-
          npx vitest run
          src/test/ide-mcp-install-windows.test.ts
          src/test/ide-mcp-install-windows-smoke.test.ts
          src/test/setup-windows-ide.test.ts
          src/test/setup-ides-result-rendering.test.ts
          src/test/v512-mcpClientConfig.test.ts
          src/test/windows-install-portability.test.ts

      - name: Verify build output
        shell: pwsh
        run: |
          if (-not (Test-Path dist/index.js)) { throw "dist/index.js is missing" }
          if (-not (Test-Path dist/cli.js)) { throw "dist/cli.js is missing" }

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.18.1"
          cache: npm

      - run: npm ci

      - name: TypeScript strict check
        run: npx tsc --noEmit

      - name: Lint (biome)
        run: npm run lint

      - name: Dead code / unused exports (knip)
        run: npm run knip

  multi-project-test:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.18.1"
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Multi-project scenario test
        run: node scripts/test-ci-scenarios.mjs multi-project

  local-storage-round-trip:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.18.1"
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Local storage round trip
        run: node scripts/test-ci-scenarios.mjs local-storage

  setup-ui-e2e:
    # Isolated Docker suite driving the interactive wizards with expect
    # (e2e-setup/). Ubuntu runners ship Docker; ~3-4 min.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Setup UI e2e (Docker, no network)
        run: npm run test:e2e-setup

  # Single required status check for branch protection / rulesets.
  # Aggregates the critical CI jobs so merge gates stay stable as the
  # matrix evolves (OpenClaw-style gate pattern for small OSS).
  ci-gate:
    name: ci-gate
    runs-on: ubuntu-latest
    needs:
      - build-and-test
      - windows-ide-integration
      - typecheck
      - multi-project-test
      - local-storage-round-trip
      - setup-ui-e2e
    if: always()
    steps:
      - name: Require all CI jobs to succeed
        run: |
          set -euo pipefail
          echo "build-and-test: ${{ needs.build-and-test.result }}"
          echo "windows-ide-integration: ${{ needs.windows-ide-integration.result }}"
          echo "typecheck: ${{ needs.typecheck.result }}"
          echo "multi-project-test: ${{ needs.multi-project-test.result }}"
          echo "local-storage-round-trip: ${{ needs.local-storage-round-trip.result }}"
          echo "setup-ui-e2e: ${{ needs.setup-ui-e2e.result }}"
          for r in \
            "${{ needs.build-and-test.result }}" \
            "${{ needs.windows-ide-integration.result }}" \
            "${{ needs.typecheck.result }}" \
            "${{ needs.multi-project-test.result }}" \
            "${{ needs.local-storage-round-trip.result }}" \
            "${{ needs.setup-ui-e2e.result }}"
          do
            if [ "$r" != "success" ]; then
              echo "CI gate failed: a required job result was '$r'"
              exit 1
            fi
          done
          echo "CI gate passed."
