name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # Node native-addon cleanup regression: https://github.com/nodejs/node/pull/65042
        node-version: [20, 22, "24.18.1"]
        exclude:
          # macOS Node 20 truncates `gnosys --help` mid-output when stdout is a
          # pipe (Node 20.x macOS stdout-flush-on-exit quirk). Affects only
          # piped capture; interactive use is fine. Track separately; re-enable
          # once on Node 22+ or when the stdout-flush bug is patched upstream.
          - os: macos-latest
            node-version: 20

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Run tests with coverage
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '24.18.1'
        run: npm run test:coverage

      # v5.13.0: !cancelled() on the reporting/guardrail steps — vitest
      # writes coverage-summary.json before its threshold check exits
      # non-zero, so the per-file diagnostics below stay available exactly
      # when the gate fails (previously they were skipped, hiding the
      # actionable message).
      - name: Upload coverage report
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' && matrix.node-version == '24.18.1' }}
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Check coverage thresholds
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' && matrix.node-version == '24.18.1' }}
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            echo "Coverage summary:"
            cat coverage/coverage-summary.json | node -e "
              const data = JSON.parse(require('fs').readFileSync('/dev/stdin', 'utf8'));
              const t = data.total;
              console.log('  Statements:', t.statements.pct + '%');
              console.log('  Branches:  ', t.branches.pct + '%');
              console.log('  Functions: ', t.functions.pct + '%');
              console.log('  Lines:     ', t.lines.pct + '%');
            "
          fi

      # v5.8.3 (#92): targeted guardrail — fail when a newly-added
      # src/lib/**/*.ts(x) file ships with 0% statement coverage. Catches
      # the regression mode that landed v5.8.0 in three back-to-back CI
      # failures (new modules without tests dropping the global average
      # under the 50% threshold).
      - name: Check coverage of newly-added files
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' && matrix.node-version == '24.18.1' }}
        run: |
          git fetch --depth=50 origin master:refs/remotes/origin/master 2>/dev/null || true
          COVERAGE_BASE_REF=origin/master node scripts/check-new-file-coverage.mjs

      - name: Verify build output
        run: |
          test -f dist/index.js
          test -f dist/cli.js
          echo "Build artifacts verified"

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24.18.1"
          cache: npm

      - run: npm ci

      - name: TypeScript strict check
        run: npx tsc --noEmit

      - name: Lint (biome)
        run: npm run lint

      - name: Dead code / unused exports (knip)
        run: npm run knip

  multi-project-test:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24.18.1"
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Multi-project scenario test
        run: node scripts/test-ci-scenarios.mjs multi-project

  local-storage-round-trip:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24.18.1"
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Local storage round trip
        run: node scripts/test-ci-scenarios.mjs local-storage

  setup-ui-e2e:
    # Isolated Docker suite driving the interactive wizards with expect
    # (e2e-setup/). Ubuntu runners ship Docker; ~3-4 min.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Setup UI e2e (Docker, no network)
        run: npm run test:e2e-setup
