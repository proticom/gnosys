# Dependabot — version + security updates for npm and GitHub Actions.
# Complements the weekly lockfile-refresh workflow (transitive bumps within ranges).
version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    # Supply-chain guard: let a new release age 7 days before proposing it.
    # Security updates are not delayed by cooldown.
    cooldown:
      default-days: 7
    labels:
      - dependencies
    ignore:
      # Types track the lowest supported Node (engines >=20.12), not the newest.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
      # TypeScript 7 is the native compiler (no tsserver bin); adopt it as a planned upgrade.
      - dependency-name: "typescript"
        update-types:
          - version-update:semver-major
      # commander 15 requires Node >=22.12; gnosys still supports Node >=20.12.
      - dependency-name: "commander"
        update-types:
          - version-update:semver-major
      # better-sqlite3 13 requires Node >=22; hold at 12 while gnosys supports Node >=20.12.
      - dependency-name: "better-sqlite3"
        versions:
          - ">=13"
    groups:
      production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - chore
    groups:
      actions:
        patterns:
          - "*"
